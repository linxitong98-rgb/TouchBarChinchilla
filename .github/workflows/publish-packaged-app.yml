name: Publish packaged app
on:
  push:
    branches: [main]
    paths: ['distribution/v1.13.3/*.part*']
  workflow_dispatch:
    inputs:
      check_only:
        description: Only check the publishing environment
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: publish-packaged-app
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'linxitong98-rgb/TouchBarChinchilla'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Restore and publish the verified installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          if [ "$CHECK_ONLY" = "true" ]; then
            gh api --method POST "repos/$GH_REPO/git/blobs" -f content=publishing-environment-check -f encoding=utf-8 --jq .sha
            exit 0
          fi
          git init package
          git -C package remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C package fetch --depth=1 origin "$GITHUB_SHA"
          git -C package checkout --detach FETCH_HEAD
          cd package
          python3 scripts/publish-packaged-app.py

